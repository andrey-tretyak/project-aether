services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      # Optional real model: set AETHER_AGENT_BACKEND=ollama (and pull a model).
      # From Docker Desktop, reach the host's Ollama with host.docker.internal.
      AETHER_AGENT_BACKEND: ${AETHER_AGENT_BACKEND:-mock}
      AETHER_OLLAMA_URL: ${AETHER_OLLAMA_URL:-http://host.docker.internal:11434}
      AETHER_OLLAMA_MODEL: ${AETHER_OLLAMA_MODEL:-llama3.2}
    depends_on:
      redis:
        condition: service_healthy
      control-plane:
        condition: service_started
