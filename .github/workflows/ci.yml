name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  chaos:
    runs-on: ubuntu-latest
    needs: unit
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Happy path (sample DAG)
        run: python scripts/chaos_test.py --dag sample_dag.json
      - name: Backlog (61 tasks, no failures)
        run: python scripts/chaos_test.py
      - name: SIGKILL a busy worker mid-run
        run: python scripts/chaos_test.py --kill-after 2
      - name: SIGTERM a busy worker (graceful drain)
        run: python scripts/chaos_test.py --stop-after 2
      - name: SIGSTOP a busy worker, resume it after reassignment (zombie writer)
        run: python scripts/chaos_test.py --pause-after 2
      - name: Control - same zombie without idempotency keys must duplicate an effect
        run: python scripts/chaos_test.py --pause-after 2 --set AETHER_IDEMPOTENCY_KEYS=false --expect-duplicate-effects
      - name: SIGKILL the leading control plane (standby takes over)
        run: python scripts/chaos_test.py --dag failover_dag.json --control-planes 2 --kill-leader-after 3
      - name: SIGSTOP the leader, resume it after takeover (deposed leader)
        run: python scripts/chaos_test.py --dag failover_dag.json --control-planes 2 --pause-leader-after 3

  compose:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Docker Compose quick start, then kill a worker and the leader
        run: python scripts/compose_smoke.py
